<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Crisp 3D shadow for small scale favicon -->
    <filter id="favShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- Solid rounded base -->
  <rect x="4" y="4" width="54" height="54" rx="14" fill="#f3eee3" stroke="#111111" stroke-width="3" filter="url(#favShadow)" />

  <!-- Pocket outline -->
  <path d="M 16 22 L 46 22 L 46 38 C 46 49 39 52 31 52 C 23 52 16 49 16 38 Z" fill="#111111" />

  <!-- Burnt orange wrench sticking out of pocket -->
  <path d="M 27 10 C 23 6 29 3 32 3 C 35 3 41 6 37 10 L 37 24 L 27 24 Z" fill="#d9541e" stroke="#111111" stroke-width="2" />
  <circle cx="32" cy="7" r="2" fill="#f3eee3" />

  <!-- Pocket center rivet -->
  <circle cx="31" cy="34" r="3" fill="#d9541e" />
</svg>

