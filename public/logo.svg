<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shadow filter for crisp neo-brutalist tactile depth -->
    <filter id="pocketShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#111111" />
    </filter>
    <filter id="pocketInner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- Neo-brutalist Base Tile -->
  <rect x="40" y="40" width="416" height="416" rx="96" fill="#f3eee3" stroke="#111111" stroke-width="24" filter="url(#pocketShadow)" />

  <!-- Pocket Silhouette Body: Stitched Pocket contour -->
  <path d="M 124 168 L 372 168 L 372 300 C 372 384 316 412 248 412 C 180 412 124 384 124 300 Z"
        fill="#111111" />

  <!-- Pocket Hem Stitching Detail -->
  <path d="M 148 196 L 348 196"
        stroke="#f3eee3" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round" />

  <!-- Utility Tool: Stylized Wrench Head emerging from pocket -->
  <g transform="translate(196, 72)">
    <!-- Wrench Head Body -->
    <path d="M 0 52 C -24 32 -32 0 -16 -24 C -4 -42 24 -46 44 -32 C 58 -22 66 -4 64 12 L 88 12 C 92 12 96 16 96 20 L 96 130 C 96 136 92 140 86 140 L 40 140 C 34 140 30 136 30 130 L 30 54 Z"
          fill="#d9541e" stroke="#111111" stroke-width="14" stroke-linejoin="round" />
    <!-- Wrench Jaw Cutout -->
    <polygon points="12,-4 38,-4 46,24 8,24" fill="#f3eee3" stroke="#111111" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Pocket Front Accent: Burnt Orange Rivet / Compass Spark -->
  <circle cx="248" cy="276" r="22" fill="#d9541e" stroke="#f3eee3" stroke-width="6" />
  <circle cx="248" cy="276" r="8" fill="#f3eee3" />

  <!-- Precision Corner Accent Tag -->
  <path d="M 336 168 L 356 168 L 356 220 L 336 210 Z" fill="#d9541e" stroke="#111111" stroke-width="8" />
</svg>

